name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - test       # Auto-deploy preview bila push ke test
      - master     # Auto-deploy production bila push ke master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=balapan --branch=${{ github.ref_name }}
